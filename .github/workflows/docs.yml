name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The deploy job publishes to GitHub Pages; the build job only needs
  # contents:read, but the Pages actions insist on declaring these up front.
  pages: write
  id-token: write

jobs:
  # --strict turns every warning (a broken link, an unlisted file) into a
  # build failure, so a PR cannot ship a dead page. The same build feeds the
  # deploy job on main.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version is pinned deliberately: Material adds behaviour between
      # releases, and an unpinned install would let an unrelated push change
      # what the site renders. Bump it on purpose, with whatever the new
      # release asks of the docs.
      - name: Install MkDocs Material
        run: python -m pip install "mkdocs-material==9.7.7"

      - name: Build
        run: mkdocs build --strict

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # GitHub Pages serves the custom domain from a CNAME file at the site
      # root. Written here rather than committed under docs/ so the docs
      # directory stays pure content and the domain lives with the
      # deployment, where a change to it belongs.
      - name: Custom domain
        run: echo "docs.spinloop.ai" > site/CNAME

      # Pages must be enabled on the repository once (Settings -> Pages ->
      # Source: GitHub Actions), or via the API:
      #   curl -X POST -H "Authorization: Bearer <token>" \
      #     https://api.github.com/repos/<owner>/<repo>/pages \
      #     -d '{"build_type":"workflow"}'
      # The workflow token cannot create the site itself, so this is a
      # one-time admin step before the first deploy.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

# An MTPLX preset for Qwen3.8-27B, mirroring the `mtplx serve` command in
# this directory's README. `spinloop serve` turns it into that command and
# runs it.
#
# These are `mtplx serve` flags with their leading dashes stripped, in MTPLX's
# own long-form vocabulary. They are NOT llama.cpp's: each engine's preset is
# read in its own vocabulary, so this file is not interchangeable with the
# ones under examples/llamacpp/.

[*]
host = 127.0.0.1
port = 8000

[qwen3.8-27b]              # the Spinloop's ALIAS selects this section
model               = Youssofal/Qwen3.8-27B-MTPLX-Optimized-Speed
context-window      = 32768   # keep in step with the Spinloop's CONTEXT
max-active-requests = 4       # the Spinloop's PARALLEL, when it states one
scheduler-mode      = parallel # serial | parallel | concurrent — per-deployment

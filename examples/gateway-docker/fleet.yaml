# The operator's view of this stack, from your machine: the two nodes over the
# ports compose publishes.
#
# The gateways are not nodes in it — they serve the fleet files baked into
# the image. The `gateway` section below names the waking gateway's published
# address instead: `spinloop fleet harness` from here points the agent at the
# gateway, with the gateway's token, and never at a node. This is also how you
# watch and drive the fleet itself: status, start, stop, metrics, logs.
#
# The engine: blocks here are not optional: each engine binds 8080 inside its
# container and is published on 18080/18081 outside, which the daemons cannot
# know. (The gateways' own fleet files need no override — inside the compose
# network the engine is where it binds.)
#
# The nodes' Spinloop source is node/Spinloop, which is also why
# `spinloop fleet start` works from here: it resolves what to run on a node
# and pushes that.
prefer: idle

# A launch routed through this file is pointed at the gateway: the address it
# serves on, and the variable holding the token for it (exported by .env).
gateway:
  url: http://127.0.0.1:4000
  tokenEnv: GATEWAY_TOKEN

nodes:
  - name: node-a
    host: 127.0.0.1
    port: 14242
    tokenEnv: NODE_A_TOKEN
    engineTokenEnv: NODE_A_ENGINE_KEY
    file: ./node/Spinloop
    engine:
      port: 18080

  - name: node-b
    host: 127.0.0.1
    port: 14243
    tokenEnv: NODE_B_TOKEN
    engineTokenEnv: NODE_B_ENGINE_KEY
    file: ./node/Spinloop
    engine:
      port: 18081

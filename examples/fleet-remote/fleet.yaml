# A fleet of `spinloop remote` environments, observed like machines.
#
#   spinloop fleet status        # one row per environment: state and what it serves
#   spinloop fleet metrics -w    # a live dashboard
#   spinloop fleet deploy --all  # create both environments from this file
#
# Each node's `name` is the registered environment it drives — one per
# `spinloop remote deploy`, or per `spinloop fleet deploy` — and what you type
# at `fleet start <node>`. `kind: remote` marks it as a cloud environment
# rather than a host. No bearer tokens here: the control plane signs each
# call, and the environment's URLs live in its remote.json, not in this file.
# So, like every fleet file, this one names environments, never an account.
#
# `fleet deploy` needs to know what each environment serves — the same thing
# `spinloop remote deploy <file>` needs, just resolved from the node rather
# than typed on the command line. Two ways to give it, shown here so you see
# both:
nodes:
  # An explicit `file`, resolved relative to this fleet file.
  - name: qwen
    kind: remote
    file: ./qwen.Spinloop

  # No `file` here: llama's own name is a subdirectory beside this file
  # (llama/Spinloop) — the convention for a fleet laid out as one
  # subdirectory per node, with nothing to declare beyond the node's name.
  # (A registered `spinloop alias` named "llama" would resolve the same way,
  # and win over the subdirectory if both existed.)
  - name: llama
    kind: remote

# The fleet the compose stack brings up. Ports are the host-side mappings from
# compose.yaml, so this works from your machine with the stack running.
#
# No secrets here: every node names the same environment variable, holding the
# fleet's shared key — each node's daemon token and the key studio's engine is
# gated with — resolved from your environment or the .env beside this file.
#
# Each node also declares where its *engine* answers. `port` above is the
# daemon's; the engine is a different port, and normally the daemon reports it
# — but here it binds 8080 inside the container and is published on another
# port outside, which the daemon cannot know. That is what `engine:` is for.
#
# studio and gpu-box declare a `file`, so `spinloop fleet start` knows what to
# run on them — it points at the same Spinloop client/Spinloop wears for a
# routed launch, so a plain `fleet start` and a routed wake agree on what
# "this fleet's fake model" means. laptop deliberately declares none: it is
# what `fleet start laptop` (and `--all`) demonstrate failing on, rather than
# falling back to a plain, config-less start.
prefer: idle

nodes:
  # studio's engine is gated with the fleet's shared key: the client sends it
  # when it starts the engine, and uses the same value to talk to it. The node
  # holds no engine key of its own, so there is nothing to keep in step.
  - name: studio
    host: 127.0.0.1
    port: 14242
    tokenEnv: FLEET_TOKEN
    engineTokenEnv: FLEET_TOKEN
    file: ./client/Spinloop
    engine:
      port: 18080

  - name: gpu-box
    host: 127.0.0.1
    port: 14243
    tokenEnv: FLEET_TOKEN
    file: ./client/Spinloop
    engine:
      port: 18081

  - name: laptop
    host: 127.0.0.1
    port: 14244
    tokenEnv: FLEET_TOKEN
    engine:
      port: 18082

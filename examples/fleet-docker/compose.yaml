# A fleet you can actually run: three nodes, each a real `spinloop daemon`
# supervising a fake engine.
#
#   cp .env.example .env
#   docker compose up -d --build
#   spinloop fleet status
#   spinloop fleet metrics -w
#
# Every node carries the fleet's shared token: the daemon refuses to listen on
# a non-loopback address without one, so any node reachable across the network
# necessarily has one. Variety in the fleet view comes from state — start some
# nodes and not others, or `docker compose stop gpu-box` to watch a node
# degrade to `unreachable` while the rest keep reporting.
name: spinloop-fleet-example

services:
  studio:
    build:
      context: ../..
      dockerfile: examples/fleet-docker/Dockerfile
    image: spinloop-fleet-node:example
    environment:
      SPINLOOP_API_TOKEN: ${FLEET_TOKEN:?set FLEET_TOKEN (copy .env.example to .env)}
    ports:
      - "14242:4242"
      # The engine, published so a routed harness launch can reach it from the
      # host. Inside the container it is always 8080; outside it is not — which
      # is exactly the case fleet.yaml's per-node `engine:` block covers.
      - "18080:8080"

  gpu-box:
    image: spinloop-fleet-node:example
    depends_on: [studio]
    environment:
      SPINLOOP_API_TOKEN: ${FLEET_TOKEN:?set FLEET_TOKEN (copy .env.example to .env)}
    ports:
      - "14243:4242"
      # The engine, published so a routed harness launch can reach it from the
      # host. Inside the container it is always 8080; outside it is not — which
      # is exactly the case fleet.yaml's per-node `engine:` block covers.
      - "18081:8080"

  laptop:
    image: spinloop-fleet-node:example
    depends_on: [studio]
    environment:
      SPINLOOP_API_TOKEN: ${FLEET_TOKEN:?set FLEET_TOKEN (copy .env.example to .env)}
    ports:
      - "14244:4242"
      # The engine, published so a routed harness launch can reach it from the
      # host. Inside the container it is always 8080; outside it is not — which
      # is exactly the case fleet.yaml's per-node `engine:` block covers.
      - "18082:8080"

# A llama.cpp preset whose *values* carry environment references. Keys are flag
# names and never resolve. Values expand when a command that consumes the
# preset reads it — `spinloop serve`, `spinloop cloud deploy`, a fleet wake —
# so the shared file stays machine-neutral while the command that runs is
# concrete. `${FOO:-bar}` stands when FOO is unset or empty; `$$` is a literal `$`.

[*]
host  = 127.0.0.1
port  = ${PORT:-8080}   # PORT=9100 spinloop serve  #  → --port 9100
jinja = 1

[qwen3.8-27b]
# QUANT=UD-Q5_K_XL spinloop serve  #  → the Q5 weights instead of the default
hf       = unsloth/Qwen3.8-27B-GGUF:${QUANT:-UD-Q4_K_XL}
ctx-size = 32768
